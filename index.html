<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Гром веков — Тренажёр ЕГЭ (История и Обществознание)</title>
<style>
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --surface-2: #eef2f6;
    --text: #18202c;
    --text-muted: #5b6778;
    --border: #dce3ec;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-soft: #eff6ff;
    --green: #16a34a;
    --green-soft: #dcfce7;
    --amber: #d97706;
    --amber-soft: #fef3c7;
    --red: #dc2626;
    --red-soft: #fee2e2;
    --purple: #7c3aed;
    --purple-soft: #f3e8ff;
    --teal: #0d9488;
    --teal-soft: #ccfbf1;
    --radius: 16px;
    --shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #273449;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-soft: rgba(59, 130, 246, 0.16);
      --green: #22c55e;
      --green-soft: rgba(34, 197, 94, 0.16);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.16);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.16);
      --purple: #a78bfa;
      --purple-soft: rgba(167, 139, 250, 0.16);
      --teal: #2dd4bf;
      --teal-soft: rgba(45, 212, 191, 0.16);
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    padding-bottom: 32px;
  }
  .app { max-width: 820px; margin: 0 auto; padding: 14px; }

  /* Header */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 12px; flex-wrap: wrap;
  }
  .brand { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
  .subject-switch {
    display: inline-flex; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 3px; gap: 3px;
  }
  .subject-btn {
    border: none; background: transparent; color: var(--text-muted); font-family: inherit;
    font-size: 0.88rem; font-weight: 600; padding: 7px 12px; border-radius: 9px; cursor: pointer;
    transition: all 0.15s;
  }
  .subject-btn.active { background: var(--primary); color: #fff; }
  .icon-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    width: 38px; height: 38px; border-radius: 11px; cursor: pointer; font-size: 1.05rem;
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* Stats bar */
  .stats-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px;
  }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 9px 10px; text-align: center;
  }
  .stat-val { font-size: 1.15rem; font-weight: 800; }
  .stat-lbl { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
  .c-green { color: var(--green); }
  .c-amber { color: var(--amber); }
  .c-red { color: var(--red); }

  /* Tabs */
  .tabs {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 13px;
    padding: 4px; margin-bottom: 12px;
  }
  .tab-btn {
    border: none; background: transparent; color: var(--text-muted); font-family: inherit;
    font-size: 0.9rem; font-weight: 700; padding: 9px 6px; border-radius: 9px; cursor: pointer;
  }
  .tab-btn.active { background: var(--primary-soft); color: var(--primary); }

  /* Filters */
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  select, input[type="text"] {
    font-family: inherit; font-size: 0.9rem; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; outline: none;
  }
  select { flex: 1; min-width: 180px; max-width: 100%; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    font-family: inherit; font-size: 0.8rem; font-weight: 600; padding: 6px 10px;
    border-radius: 999px; cursor: pointer; transition: all 0.15s;
  }
  .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* Flashcard */
  .card-meta {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    margin-bottom: 10px; font-size: 0.82rem; color: var(--text-muted); flex-wrap: wrap;
  }
  .badges { display: flex; gap: 5px; flex-wrap: wrap; }
  .badge {
    font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-muted);
  }
  .badge-art { background: var(--purple-soft); color: var(--purple); }
  .badge-religion { background: var(--teal-soft); color: var(--teal); }
  .badge-reforms { background: var(--amber-soft); color: var(--amber); }
  .badge-task18 { background: var(--amber-soft); color: var(--amber); }
  .badge-date { background: var(--primary-soft); color: var(--primary); }

  .flashcard {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 26px 20px; min-height: 230px; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center; cursor: pointer;
    box-shadow: var(--shadow); transition: transform 0.12s; position: relative;
    user-select: none;
  }
  .flashcard:active { transform: scale(0.99); }
  .card-side-label {
    position: absolute; top: 12px; left: 16px; font-size: 0.72rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);
  }
  .card-topic-small {
    font-size: 0.78rem; color: var(--text-muted); margin-bottom: 12px; margin-top: 10px;
  }
  .card-text { font-size: 1.25rem; font-weight: 700; word-break: break-word; }
  .card-text.back-text { font-size: 1.05rem; font-weight: 500; }
  .tap-hint { margin-top: 18px; font-size: 0.78rem; color: var(--text-muted); }

  .actions-rate {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px;
  }
  .btn {
    border: none; border-radius: 12px; padding: 12px 10px; font-family: inherit;
    font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.85; }
  .btn-know { background: var(--green-soft); color: var(--green); }
  .btn-repeat { background: var(--amber-soft); color: var(--amber); }
  .btn-hard { background: var(--red-soft); color: var(--red); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-sec { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }

  .nav-row {
    display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px;
  }

  /* Quiz */
  .quiz-q { font-size: 1.15rem; font-weight: 700; margin: 12px 0 16px; text-align: center; }
  .quiz-opts { display: flex; flex-direction: column; gap: 9px; }
  .quiz-opt {
    text-align: left; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; font-family: inherit; font-size: 0.92rem;
    color: var(--text); cursor: pointer; line-height: 1.4;
  }
  .quiz-opt.correct { background: var(--green-soft); border-color: var(--green); color: var(--green); font-weight: 700; }
  .quiz-opt.wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); }

  /* Reference */
  .search-input { width: 100%; margin-bottom: 10px; }
  .ref-list { display: flex; flex-direction: column; gap: 8px; }
  .ref-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px;
  }
  .ref-front { font-weight: 700; font-size: 0.96rem; margin-bottom: 4px; }
  .ref-back { font-size: 0.88rem; color: var(--text-muted); }
  .ref-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; font-size: 0.74rem; color: var(--text-muted); }

  /* Modal & Upload fallback */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    padding: 20px; width: 100%; max-width: 440px; box-shadow: var(--shadow);
  }
  .modal h3 { margin-bottom: 12px; font-size: 1.1rem; }
  .modal-actions { display: flex; flex-direction: column; gap: 8px; }

  .empty-box {
    text-align: center; padding: 32px 16px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">⚡ Гром веков</div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <div class="subject-switch">
        <button class="subject-btn active" id="subjHistory" onclick="switchSubject('history')">🏛 История</button>
        <button class="subject-btn" id="subjSocial" onclick="switchSubject('social')">⚖️ Обществознание</button>
      </div>
      <button class="icon-btn" title="Настройки и резервная копия" onclick="openSettings()">⚙️</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-val" id="stTotal">0</div><div class="stat-lbl">Всего</div></div>
    <div class="stat-card"><div class="stat-val c-green" id="stKnow">0</div><div class="stat-lbl">Знаю</div></div>
    <div class="stat-card"><div class="stat-val c-amber" id="stRepeat">0</div><div class="stat-lbl">Повторить</div></div>
    <div class="stat-card"><div class="stat-val c-red" id="stHard">0</div><div class="stat-lbl">Сложные</div></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabCards" onclick="switchMode('cards')">🗂 Карточки</button>
    <button class="tab-btn" id="tabQuiz" onclick="switchMode('quiz')">🎯 Тест</button>
    <button class="tab-btn" id="tabRef" onclick="switchMode('ref')">📖 Справочник</button>
  </div>

  <div class="panel" id="filtersPanel">
    <div class="filter-row">
      <select id="topicSelect" onchange="applyFilters()"><option value="all">Все темы</option></select>
      <select id="statusSelect" style="flex:0 0 auto;min-width:140px;" onchange="applyFilters()">
        <option value="all">Все статусы</option>
        <option value="unseen">Новые</option>
        <option value="repeat">Повторить</option>
        <option value="hard">Сложные</option>
        <option value="know">Знаю</option>
      </select>
    </div>
    <div class="chips" id="tagChips"></div>
  </div>

  <!-- Loading / Fallback -->
  <div id="loadBox" class="empty-box">
    <div id="loadMsg" style="font-weight:700;margin-bottom:8px;">Загрузка базы карточек...</div>
    <div id="manualUpload" class="hidden" style="margin-top:12px;">
      <p style="font-size:0.86rem;color:var(--text-muted);margin-bottom:12px;">
        Не удалось автоматически загрузить JSON-файл базы. Выберите файл вручную:
      </p>
      <label class="btn btn-primary" style="display:inline-block;">
        Загрузить базу (.json)
        <input type="file" accept=".json" style="display:none;" onchange="handleManualJson(event)">
      </label>
    </div>
  </div>

  <!-- Cards View -->
  <div id="viewCards" class="hidden">
    <div class="card-meta">
      <span id="cardCounter">0 / 0</span>
      <div class="badges" id="cardBadges"></div>
    </div>
    <div class="flashcard" id="flashcard" onclick="flipCard()">
      <span class="card-side-label" id="cardSideLabel">Вопрос</span>
      <div class="card-topic-small" id="cardTopic"></div>
      <div class="card-text" id="cardText"></div>
      <div class="tap-hint" id="tapHint">Нажмите на карточку, чтобы увидеть ответ</div>
    </div>
    <div class="actions-rate">
      <button class="btn btn-know" onclick="rateCard('know')">✅ Знаю</button>
      <button class="btn btn-repeat" onclick="rateCard('repeat')">🔁 Повторить</button>
      <button class="btn btn-hard" onclick="rateCard('hard')">🔥 Сложная</button>
    </div>
    <div class="nav-row">
      <button class="btn btn-sec" onclick="prevCard()">← Назад</button>
      <button class="btn btn-sec" onclick="shuffleDeck()">🔀 Перемешать</button>
      <button class="btn btn-sec" onclick="nextCard()">Вперёд →</button>
    </div>
  </div>

  <!-- Quiz View -->
  <div id="viewQuiz" class="hidden">
    <div class="panel">
      <div class="card-meta">
        <span id="quizScore">Счёт: 0 / 0</span>
        <div class="badges" id="quizBadges"></div>
      </div>
      <div class="card-topic-small" id="quizTopic" style="text-align:center;"></div>
      <div class="quiz-q" id="quizQ"></div>
      <div class="quiz-opts" id="quizOpts"></div>
      <div style="margin-top:14px;text-align:center;">
        <button class="btn btn-primary hidden" id="quizNextBtn" onclick="nextQuiz()">Следующий вопрос →</button>
      </div>
    </div>
  </div>

  <!-- Reference View -->
  <div id="viewRef" class="hidden">
    <input type="text" id="refSearch" class="search-input" placeholder="Поиск по термину, дате или описанию..." oninput="renderRef()">
    <div id="refCount" style="font-size:0.8rem;color:var(--text-muted);margin-bottom:8px;"></div>
    <div class="ref-list" id="refList"></div>
  </div>

  <!-- Empty filtered -->
  <div id="emptyFiltered" class="empty-box hidden">
    <div style="font-weight:700;margin-bottom:6px;">По выбранным фильтрам карточек нет</div>
    <button class="btn btn-sec" onclick="resetFilters()">Сбросить фильтры</button>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-bg" id="settingsModal" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <h3>⚙️ Настройки и прогресс</h3>
    <div class="modal-actions">
      <button class="btn btn-sec" onclick="exportProgress()">💾 Сохранить прогресс (JSON)</button>
      <label class="btn btn-sec" style="text-align:center;">
        📂 Загрузить прогресс (JSON)
        <input type="file" accept=".json" style="display:none;" onchange="importProgress(event)">
      </label>
      <button class="btn btn-hard" onclick="resetSubjectProgress()">🗑 Сбросить прогресс текущего предмета</button>
      <button class="btn btn-primary" onclick="closeSettings()">Закрыть</button>
    </div>
  </div>
</div>

<script>
const SUBJECT_CONFIG = {
  history: {
    files: ['history_base.json', 'history_extra.json'],
    storageKey: 'ege_history_trainer_progress_v1',
    filters: [
      { id: 'all', label: 'Все' },
      { id: 'date', label: '📅 Только даты' },
      { id: 'art', label: '🎨 Искусство' },
      { id: 'religion', label: '⛪ Религия' },
      { id: 'reforms', label: '📜 Реформы' }
    ]
  },
  social: {
    files: ['social_base.json'],
    storageKey: 'ege_social_trainer_progress_v1',
    filters: [
      { id: 'all', label: 'Все термины' },
      { id: 'task18', label: '⭐ Задание №18' }
    ]
  }
};

const ART_RE = /(архитектор|художник|скульптор|композитор|писател|поэт|драматург|иконопис|режисс[её]р|акт[её]р|певец|балет|опер[аыеу]|роман[аеу]?|повест[иь]|поэм[аыеу]|пьес[аыеу]|комеди[яию]|трагеди[яию]|картин[аыеу]|портрет|собор|храм|стил[ьяе]|барокко|классицизм|ампир|модерн|шатров|крестово-купольн|фреск|мозаик|парсун|передвижник|могуч[аеий]+ кучк|театр|кино|фильм|симфони|памятник|дворец|грановит|мавзоле|ансамбл|роспис|литерат|летопис|житие|слово о |сказание о |хождени[ея]|хожени[ея]|домострой|академия художеств|третьяков|консерватори|эрмитаж|авангард|символизм|акмеизм|футуризм|реализм|романтизм|сентиментализм|соцреализм|пролеткульт|самиздат|музык|живопис|зодч|книгопечат|типографи)/i;
const RELIGION_RE = /(крещени|язычеств|православи|христианств|ислам|буддизм|католич|протестант|униат|церк[овь]|церковн|митрополит|патриарх|епископ|архиепископ|священник|монах|монашеств|монастыр|лавр[аыеу]|игумен|протопоп|свят[оыа][йхя]|канонизир|житие|ерес[иь]|еретик|раскол|старообряд|нестяжател|иосифлян|стяжател|синод|обер-прокурор|духовн[а-я]+ регламент|секуляризац|веротерпимост|свобода совести|антирелигиозн|атеизм|безбожник|волхв|перун|десятин[аыеу]|стоглав|автокефал|икон[аыеу]|библи|евангели|духовенств|храм|собор)/i;
const REFORMS_RE = /(реформ|контрреформ|судебник|соборное уложение|русская правда|уложение о службе|генеральный регламент|духовный регламент|табель о рангах|жалованн[а-я]+ грамот|конституц|кодекс|декрет|манифест|указ о[б]? |отмен[аыеу] крепостн|отмен[аыеу] местничеств|отмен[аыеу] кормлен|отмен[аыеу] подушн|отмен[аыеу] внутренних|введени[ея]|учреждени[ея] (коллег|министерств|сенат|синод|губерн|земств|дум|патриарш)|избранн[а-я]+ рад|негласн[а-я]+ комитет|сперанск|кисел[её]в|канкрин|витте|столыпин|нэп|коллективизац|индустриализац|совнархоз|косыгин|перестройк|гласност|приватизац|шоков[а-я]+ терапи|монетизац|уроки и погост|погост|юрьев день|заповедн[а-я]+ лет|урочн[а-я]+ лет|земск[а-я]+ (реформ|самоуправлен)|судебн[а-я]+ реформ|военн[а-я]+ реформ|денежн[а-я]+ реформ|налогов[а-я]+ реформ|губернск[а-я]+ реформ|городск[а-я]+ реформ|школьн[а-я]+ реформ|университетск[а-я]+ устав|губн[а-я]+ реформ|приказн[а-я]+ систем|подушн[а-я]+ подат|подворн[а-я]+ |посошн[а-я]+ |рекрутск|всеобщ[а-я]+ воинск|вольных хлебопашц|обязанных крестьян|выкупн[а-я]+ (платеж|операц))/i;
const DATE_RE = /(^\d{3,4}\b|\b\d{3,4}\s*[–—-]\s*\d{2,4}\b|\b(январ|феврал|март|апрел|ма[йя]|июн|июл|август|сентябр|октябр|ноябр|декабр)[а-я]*\s+\d{3,4}|\b[XVI]+\s*в)/i;

let currentSubject = 'history';
let currentMode = 'cards';
let activeTag = 'all';
let cache = { history: null, social: null };
let allCards = [];
let filteredCards = [];
let deckIndex = 0;
let isFlipped = false;
let quizRight = 0, quizTotal = 0, quizLocked = false, currentQuizCard = null;

function getProgress(subj = currentSubject) {
  try {
    return JSON.parse(localStorage.getItem(SUBJECT_CONFIG[subj].storageKey) || '{}');
  } catch { return {}; }
}
function saveProgress(prog, subj = currentSubject) {
  localStorage.setItem(SUBJECT_CONFIG[subj].storageKey, JSON.stringify(prog));
}

function enrichCard(card, subj) {
  const c = Object.assign({}, card);
  if (subj === 'history') {
    const tags = Array.isArray(c.tags) ? [...c.tags] : [];
    const txt = (c.front || '') + ' ' + (c.back || '');
    if (!tags.includes('art') && ART_RE.test(txt)) tags.push('art');
    if (!tags.includes('religion') && RELIGION_RE.test(txt)) tags.push('religion');
    if (!tags.includes('reforms') && REFORMS_RE.test(txt)) tags.push('reforms');
    c.tags = tags;
    c.isDate = c.type === 'date' || DATE_RE.test(c.front || '');
  } else {
    c.tags = c.type === 'task18' ? ['task18'] : [];
    c.isDate = false;
  }
  return c;
}

async function loadSubject(subj) {
  currentSubject = subj;
  activeTag = 'all';
  document.getElementById('subjHistory').classList.toggle('active', subj === 'history');
  document.getElementById('subjSocial').classList.toggle('active', subj === 'social');
  renderTagChips();

  if (cache[subj]) {
    allCards = cache[subj];
    afterLoad();
    return;
  }

  showLoading('Загрузка базы карточек...');
  const files = SUBJECT_CONFIG[subj].files;
  const loaded = [];
  for (let i = 0; i < files.length; i++) {
    try {
      const res = await fetch(files[i] + '?v=' + Date.now());
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data)) {
          data.forEach(item => loaded.push(enrichCard(item, subj)));
        }
      }
    } catch (e) {
      // Optional secondary files are skipped silently
    }
  }

  if (loaded.length === 0) {
    document.getElementById('loadMsg').textContent = 'Загрузите базу карточек';
    document.getElementById('manualUpload').classList.remove('hidden');
    return;
  }

  cache[subj] = loaded;
  allCards = loaded;
  afterLoad();
}

function showLoading(msg) {
  document.getElementById('loadBox').classList.remove('hidden');
  document.getElementById('loadMsg').textContent = msg;
  document.getElementById('manualUpload').classList.add('hidden');
  document.getElementById('viewCards').classList.add('hidden');
  document.getElementById('viewQuiz').classList.add('hidden');
  document.getElementById('viewRef').classList.add('hidden');
  document.getElementById('emptyFiltered').classList.add('hidden');
}

function afterLoad() {
  document.getElementById('loadBox').classList.add('hidden');
  populateTopics();
  updateStats();
  applyFilters();
}

function handleManualJson(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data)) throw new Error();
      const enriched = data.map(item => enrichCard(item, currentSubject));
      cache[currentSubject] = enriched;
      allCards = enriched;
      afterLoad();
    } catch {
      alert('Не удалось прочитать JSON-файл. Проверьте формат.');
    }
  };
  reader.readAsText(file, 'utf-8');
}

function populateTopics() {
  const sel = document.getElementById('topicSelect');
  const counts = {};
  const order = [];
  allCards.forEach(c => {
    const t = c.topic || 'Без темы';
    if (!counts[t]) order.push(t);
    counts[t] = (counts[t] || 0) + 1;
  });
  sel.innerHTML = `<option value="all">Все темы (${allCards.length})</option>` +
    order.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)} (${counts[t]})</option>`).join('');
  document.getElementById('statusSelect').value = 'all';
}

function renderTagChips() {
  const box = document.getElementById('tagChips');
  const list = SUBJECT_CONFIG[currentSubject].filters;
  box.innerHTML = list.map(f =>
    `<button class="chip ${activeTag === f.id ? 'active' : ''}" onclick="setTag('${f.id}')">${f.label}</button>`
  ).join('');
}

function setTag(tag) {
  activeTag = tag;
  renderTagChips();
  applyFilters();
}

function resetFilters() {
  document.getElementById('topicSelect').value = 'all';
  document.getElementById('statusSelect').value = 'all';
  activeTag = 'all';
  renderTagChips();
  applyFilters();
}

function applyFilters() {
  const topic = document.getElementById('topicSelect').value;
  const status = document.getElementById('statusSelect').value;
  const prog = getProgress();

  filteredCards = allCards.filter(c => {
    if (topic !== 'all' && (c.topic || 'Без темы') !== topic) return false;
    const st = prog[c.id] || 'unseen';
    if (status !== 'all' && st !== status) return false;
    if (activeTag === 'date' && !c.isDate) return false;
    if (activeTag !== 'all' && activeTag !== 'date' && !(c.tags || []).includes(activeTag)) return false;
    return true;
  });

  deckIndex = 0;
  isFlipped = false;
  quizRight = 0; quizTotal = 0;
  renderCurrentMode();
}

function updateStats() {
  const prog = getProgress();
  let know = 0, repeat = 0, hard = 0;
  allCards.forEach(c => {
    const st = prog[c.id];
    if (st === 'know') know++;
    else if (st === 'repeat') repeat++;
    else if (st === 'hard') hard++;
  });
  document.getElementById('stTotal').textContent = allCards.length;
  document.getElementById('stKnow').textContent = know;
  document.getElementById('stRepeat').textContent = repeat;
  document.getElementById('stHard').textContent = hard;
}

function switchSubject(subj) {
  if (subj === currentSubject && cache[subj]) return;
  loadSubject(subj);
}

function switchMode(mode) {
  currentMode = mode;
  document.getElementById('tabCards').classList.toggle('active', mode === 'cards');
  document.getElementById('tabQuiz').classList.toggle('active', mode === 'quiz');
  document.getElementById('tabRef').classList.toggle('active', mode === 'ref');
  renderCurrentMode();
}

function renderCurrentMode() {
  if (!allCards.length) return;
  document.getElementById('viewCards').classList.add('hidden');
  document.getElementById('viewQuiz').classList.add('hidden');
  document.getElementById('viewRef').classList.add('hidden');
  document.getElementById('emptyFiltered').classList.add('hidden');

  if (filteredCards.length === 0) {
    document.getElementById('emptyFiltered').classList.remove('hidden');
    return;
  }
  if (currentMode === 'cards') {
    document.getElementById('viewCards').classList.remove('hidden');
    renderCard();
  } else if (currentMode === 'quiz') {
    document.getElementById('viewQuiz').classList.remove('hidden');
    nextQuiz();
  } else {
    document.getElementById('viewRef').classList.remove('hidden');
    renderRef();
  }
}

function renderBadgesHtml(c) {
  const out = [];
  if (c.isDate) out.push('<span class="badge badge-date">📅 Дата</span>');
  (c.tags || []).forEach(t => {
    if (t === 'art') out.push('<span class="badge badge-art">🎨 Искусство</span>');
    if (t === 'religion') out.push('<span class="badge badge-religion">⛪ Религия</span>');
    if (t === 'reforms') out.push('<span class="badge badge-reforms">📜 Реформы</span>');
    if (t === 'task18') out.push('<span class="badge badge-task18">⭐ №18</span>');
  });
  return out.join('');
}

function renderCard() {
  const c = filteredCards[deckIndex];
  if (!c) return;
  document.getElementById('cardCounter').textContent = `Карточка ${deckIndex + 1} из ${filteredCards.length}`;
  document.getElementById('cardBadges').innerHTML = renderBadgesHtml(c);
  document.getElementById('cardTopic').textContent = c.topic || '';
  const textEl = document.getElementById('cardText');
  if (isFlipped) {
    document.getElementById('cardSideLabel').textContent = 'Ответ';
    textEl.textContent = c.back || '';
    textEl.className = 'card-text back-text';
    document.getElementById('tapHint').textContent = 'Нажмите, чтобы вернуть вопрос';
  } else {
    document.getElementById('cardSideLabel').textContent = 'Вопрос';
    textEl.textContent = c.front || '';
    textEl.className = 'card-text';
    document.getElementById('tapHint').textContent = 'Нажмите на карточку, чтобы увидеть ответ';
  }
}

function flipCard() { isFlipped = !isFlipped; renderCard(); }
function nextCard() { deckIndex = (deckIndex + 1) % filteredCards.length; isFlipped = false; renderCard(); }
function prevCard() { deckIndex = (deckIndex - 1 + filteredCards.length) % filteredCards.length; isFlipped = false; renderCard(); }
function shuffleDeck() {
  for (let i = filteredCards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredCards[i], filteredCards[j]] = [filteredCards[j], filteredCards[i]];
  }
  deckIndex = 0; isFlipped = false; renderCard();
}
function rateCard(status) {
  const c = filteredCards[deckIndex];
  if (!c) return;
  const prog = getProgress();
  prog[c.id] = status;
  saveProgress(prog);
  updateStats();
  nextCard();
}

function nextQuiz() {
  quizLocked = false;
  document.getElementById('quizNextBtn').classList.add('hidden');
  document.getElementById('quizScore').textContent = `Счёт: ${quizRight} / ${quizTotal}`;
  const card = filteredCards[Math.floor(Math.random() * filteredCards.length)];
  currentQuizCard = card;
  document.getElementById('quizBadges').innerHTML = renderBadgesHtml(card);
  document.getElementById('quizTopic').textContent = card.topic || '';
  document.getElementById('quizQ').textContent = card.front || '';

  const pool = allCards.filter(x => x.id !== card.id && x.back !== card.back);
  const distractors = [];
  const used = new Set([card.back]);
  while (distractors.length < 3 && pool.length > 0) {
    const pick = pool[Math.floor(Math.random() * pool.length)];
    if (!used.has(pick.back)) {
      used.add(pick.back);
      distractors.push(pick.back);
    } else {
      break;
    }
  }
  const opts = [card.back, ...distractors].sort(() => Math.random() - 0.5);
  const box = document.getElementById('quizOpts');
  box.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quiz-opt';
    btn.textContent = opt;
    btn.onclick = () => checkQuiz(btn, opt === card.back);
    box.appendChild(btn);
  });
}

function checkQuiz(btn, isCorrect) {
  if (quizLocked) return;
  quizLocked = true;
  quizTotal++;
  if (isCorrect) {
    quizRight++;
    btn.classList.add('correct');
  } else {
    btn.classList.add('wrong');
    Array.from(document.getElementById('quizOpts').children).forEach(b => {
      if (b.textContent === currentQuizCard.back) b.classList.add('correct');
    });
  }
  document.getElementById('quizScore').textContent = `Счёт: ${quizRight} / ${quizTotal}`;
  document.getElementById('quizNextBtn').classList.remove('hidden');
}

function renderRef() {
  const q = (document.getElementById('refSearch').value || '').trim().toLowerCase();
  const list = q ? filteredCards.filter(c =>
    (c.front || '').toLowerCase().includes(q) || (c.back || '').toLowerCase().includes(q)
  ) : filteredCards;
  document.getElementById('refCount').textContent = `Найдено: ${list.length} (показаны первые ${Math.min(list.length, 150)})`;
  document.getElementById('refList').innerHTML = list.slice(0, 150).map(c => `
    <div class="ref-item">
      <div class="ref-front">${escapeHtml(c.front || '')}</div>
      <div class="ref-back">${escapeHtml(c.back || '')}</div>
      <div class="ref-meta">${renderBadgesHtml(c)} <span>${escapeHtml(c.topic || '')}</span></div>
    </div>
  `).join('');
}

function openSettings() { document.getElementById('settingsModal').classList.add('open'); }
function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }

function exportProgress() {
  const payload = {
    version: 2,
    history: getProgress('history'),
    social: getProgress('social')
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'grom_vekov_progress.json';
  a.click();
}

function importProgress(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (data.version === 2 && (data.history || data.social)) {
        if (data.history) saveProgress(data.history, 'history');
        if (data.social) saveProgress(data.social, 'social');
      } else {
        saveProgress(data, currentSubject);
      }
      updateStats();
      applyFilters();
      closeSettings();
      alert('Прогресс восстановлен!');
    } catch {
      alert('Ошибка чтения файла прогресса.');
    }
  };
  reader.readAsText(file, 'utf-8');
}

function resetSubjectProgress() {
  if (!confirm('Сбросить весь прогресс по текущему предмету?')) return;
  saveProgress({}, currentSubject);
  updateStats();
  applyFilters();
  closeSettings();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

loadSubject('history');
</script>
